[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-bittorrent-client"
version = "0.1.0"
description = "Cliente BitTorrent educacional em Python puro (apenas biblioteca padrao)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Fabricio Araújo" }
]
keywords = ["bittorrent", "peer-to-peer", "p2p", "networking", "bencode", "bep"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: File Sharing",
    "Topic :: Internet",
]
dependencies = []

[project.scripts]
simple-torrent = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
